# Full mutation run over every source file. Not a merge gate: fix what it finds the next day.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC. Not on the hour: GitHub's scheduler is busiest then and delays runs.
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  mutation:
    name: mutation (full)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:mutation --force # --force: test every mutant, never reuse saved results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/
